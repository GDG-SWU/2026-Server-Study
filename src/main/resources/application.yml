spring:
  application:
    name: Server_Study_2026
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/library?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
        jdbc:
          time_zone: Asia/Seoul

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
