spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      #ddl-auto : 테이블을 어떻게 관리할지
        ddl-auto: update      # 개발/학습용(없으면 생성). 운영에서는 validate 또는 none
    properties:
      hibernate:
        format_sql: true
    show-sql: true