spring:
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
